name: Session Log
on:
  push:
    paths-ignore:
      - 'docs/SESSION_LOG.md'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update session log
        run: |
          python tools/ci_session_logger.py "${{ github.event.before }}" "${{ github.sha }}"
      - name: Commit & push changes
        run: |
          if ! git diff --quiet; then
            git config user.name "session-log-bot"
            git config user.email "actions@github.com"
            git add docs/SESSION_LOG.md
            git commit -m "Update SESSION_LOG [ci]"
            git push
          fi
